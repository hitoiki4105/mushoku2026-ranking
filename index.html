<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無色透名祭4 ランキング記録</title>
<style>
  body { font-family: sans-serif; max-width: 1100px; margin: 1rem auto; padding: 0 1rem; }
  #views button, #tabs button, #pager button { margin: 0 4px 4px 0; padding: 6px 10px; cursor: pointer; }
  #views button.active, #tabs button.active { background: #333; color: #fff; }
  #tabs { margin-bottom: 8px; }
  .rangeRow { margin: 8px 0; }
  .rangeRow label { margin-right: 12px; white-space: nowrap; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { border-bottom: 1px solid #ccc; padding: 4px 6px; text-align: left; font-size: 14px; }
  td.num { text-align: right; }
  .wrap { overflow-x: auto; }
  #chartBox { position: relative; height: 640px; margin-top: 8px; }
  .note { color: #666; font-size: 13px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body>
<h1>無色透名祭4参加曲 ランキング記録</h1>

<div id="views"></div>
<div id="tabs"></div>
<div class="rangeRow">表示範囲：<span id="rangeRadios"></span></div>
<div class="rangeRow">表示範囲：<span id="growthRadio"></span> <span id="rangeNote" class="note"></span></div>

<!-- 表 -->
<div id="tableView">
  <p>
    <label>取得日 <select id="date"></select></label>
    <span id="meta"></span>
  </p>
  <div id="pager"></div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th>順位</th><th>作品ID</th><th>曲名</th><th>投稿日時</th><th>再生数</th>
        <th>いいね！</th><th>コメント</th><th>マイリスト</th><th>最終コメント</th>
        <th class="gcol" hidden>再生数増加率（前日→当日）</th>
        <th class="gcol" hidden>再生数増加率（前々日→前日）</th>
      </tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<!-- グラフ -->
<div id="graphView" hidden>
  <p>
    <label>縦軸 <select id="metric"></select></label>
    <label><input type="checkbox" id="logScale"> 対数目盛</label>
    <span id="graphMsg"></span>
  </p>
  <p class="note">1本の線が1曲です。点をクリックすると動画ページが開きます。取得日ごとのデータが2日分以上たまると、点が線でつながります。「全曲」など本数が多い範囲は、表示に時間がかかることがあります。「増加割合増加曲」は、最新の取得日で増加率が増えた曲だけを、全期間の線で表示します。</p>
  <div id="chartBox"><canvas id="chart"></canvas></div>
</div>

<script>
const WORKER = 'https://mushoku-ranking.hitoiki4105.workers.dev';
const PAGE_SIZE = 200;
const BLOCK = 1111; // 表示範囲の刻み

const TABS = [
  ['viewCounter', '再生数'], ['likeCounter', 'いいね！数'],
  ['commentCounter', 'コメント数'], ['mylistCounter', 'マイリスト登録数'],
];
// グラフの縦軸の選択肢
const METRICS = [
  ['rank', '順位'], ['viewCounter', '再生数'], ['likeCounter', 'いいね！数'],
  ['commentCounter', 'コメント数'], ['mylistCounter', 'マイリスト登録数'],
];
// タブごとの縦軸の初期値
const DEFAULT_METRIC = {
  viewCounter: 'viewCounter', likeCounter: 'likeCounter',
  commentCounter: 'commentCounter', mylistCounter: 'mylistCounter',
};

let dates = [];        // 取得日の一覧（新しい順）
const cache = {};      // 取得日 -> データ（Promise）
const growthCache = {}; // 取得日 -> 増加割合増加曲の情報（Promise）
let data = null;       // 表に表示中のデータ
let dataDate = null;   // 表に表示中のデータの取得日
let current = 'viewCounter';
let view = 'table';
let range = 0;         // 表示範囲: ブロック番号（0始まり）、'all'、'growth'（増加割合増加曲）
let maxSongs = 0;      // これまでに読み込んだ中で最も多い曲数
let page = 0;
let chart = null;

const fmtDate = s => s ? new Date(s).toLocaleString('ja-JP') : '';
const fmtNum = n => (n ?? '').toLocaleString?.() ?? '';
const fmtPct = x => (x * 100).toFixed(1) + '%';
const $ = id => document.getElementById(id);

/* ---------- データの読み込みと並べ替え ---------- */
function normalize(raw) {
  if (raw.rows) {
    // 新形式: 全曲のデータ。重複する作品IDを除く
    const seen = new Set();
    const rows = [];
    for (const r of raw.rows) {
      if (!seen.has(r.contentId)) { seen.add(r.contentId); rows.push(r); }
    }
    return { legacy: false, rows, totalCount: raw.totalCount, snapshot: raw.snapshot, memo: {} };
  }
  // 旧形式: 上位のみ保存されている日
  return { legacy: true, lists: raw.lists ?? {}, totalCount: raw.totalCount, snapshot: raw.snapshot, memo: {} };
}

function updateMax(d) {
  const n = d.legacy
    ? Math.max(0, ...Object.values(d.lists).map(l => l.length))
    : d.rows.length;
  if (n > maxSongs) {
    maxSongs = n;
    renderRangeRadios();
  }
}

function getData(date) {
  if (!cache[date]) {
    cache[date] = fetch(WORKER + '/data?date=' + date)
      .then(r => { if (!r.ok) throw new Error(date + ': ' + r.status); return r.json(); })
      .then(normalize)
      .then(d => { updateMax(d); return d; })
      .catch(e => { delete cache[date]; throw e; });
  }
  return cache[date];
}

// 指定したソート順で全曲を並べ、順位を付ける
function fullList(d, key) {
  if (d.memo[key]) return d.memo[key];
  let list;
  if (d.legacy) {
    list = d.lists[key] ?? [];
  } else {
    const arr = [...d.rows];
    arr.sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1)); // 多い順
    list = arr.map((r, i) => ({ ...r, rank: i + 1 }));
  }
  d.memo[key] = list;
  return list;
}

function applyRange(list, r) {
  if (r === 'all') return list;
  return list.slice(r * BLOCK, (r + 1) * BLOCK);
}

/* ---------- 増加割合増加曲 ---------- */
// 作品ID -> 再生数 の対応表（その日に載っている全曲分）
function viewMap(d) {
  if (d.viewMap) return d.viewMap;
  const m = new Map();
  if (d.legacy) {
    for (const list of Object.values(d.lists)) {
      for (const r of list) if (r.viewCounter != null) m.set(r.contentId, r.viewCounter);
    }
  } else {
    for (const r of d.rows) if (r.viewCounter != null) m.set(r.contentId, r.viewCounter);
  }
  d.viewMap = m;
  return m;
}

// 指定した取得日について、前日比の再生数増加率が、その前日の増加率より大きくなった曲を調べる
// 戻り値: Map(作品ID -> {r1: 前々日→前日の増加率, r2: 前日→当日の増加率})。比べられる日数がなければ null
function growthInfo(dateStr) {
  if (!growthCache[dateStr]) {
    growthCache[dateStr] = (async () => {
      const asc = [...dates].sort();
      const i = asc.indexOf(dateStr);
      if (i < 2) return null;
      const [d0, d1, d2] = await Promise.all([asc[i - 2], asc[i - 1], asc[i]].map(getData));
      const m0 = viewMap(d0), m1 = viewMap(d1), m2 = viewMap(d2);
      const out = new Map();
      for (const [id, v2] of m2) {
        const v1 = m1.get(id), v0 = m0.get(id);
        if (v0 == null || v1 == null || v0 <= 0 || v1 <= 0) continue;
        const r1 = (v1 - v0) / v0;
        const r2 = (v2 - v1) / v1;
        if (r2 > r1) out.set(id, { r1, r2 });
      }
      return out;
    })().catch(e => { delete growthCache[dateStr]; throw e; });
  }
  return growthCache[dateStr];
}

function td(text, cls) {
  const e = document.createElement('td');
  e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

/* ---------- ボタン類 ---------- */
function renderViews() {
  const box = $('views');
  box.replaceChildren();
  for (const [key, label] of [['table', '表'], ['graph', 'グラフ']]) {
    const b = document.createElement('button');
    b.textContent = label;
    if (key === view) b.className = 'active';
    b.onclick = () => {
      view = key;
      $('tableView').hidden = view !== 'table';
      $('graphView').hidden = view !== 'graph';
      renderViews();
      if (view === 'graph') renderGraph();
    };
    box.appendChild(b);
  }
}

function renderTabs() {
  const box = $('tabs');
  box.replaceChildren();
  for (const [key, label] of TABS) {
    const b = document.createElement('button');
    b.textContent = label;
    if (key === current) b.className = 'active';
    b.onclick = () => {
      current = key;
      page = 0;
      $('metric').value = DEFAULT_METRIC[key];
      renderTabs();
      renderTable();
      if (view === 'graph') renderGraph();
    };
    box.appendChild(b);
  }
}

function makeRadio(val, label) {
  const l = document.createElement('label');
  const r = document.createElement('input');
  r.type = 'radio';
  r.name = 'range'; // 2つの行で同じ名前にして、どちらか1つだけ選べるようにする
  r.value = String(val);
  r.checked = String(range) === String(val);
  r.onchange = () => {
    range = val;
    page = 0;
    renderTable();
    if (view === 'graph') renderGraph();
  };
  l.append(r, ' ' + label);
  return l;
}

// 表示範囲のラジオボタン（1111位ずつ。曲数に応じて増える）と、増加割合増加曲
function renderRangeRadios() {
  const box = $('rangeRadios');
  box.replaceChildren();
  const blocks = Math.max(1, Math.ceil(maxSongs / BLOCK));
  if (typeof range === 'number' && range >= blocks) range = 0;

  for (let i = 0; i < blocks; i++) {
    const start = i * BLOCK + 1;
    let end = (i + 1) * BLOCK;
    if (maxSongs > 0) end = Math.min(end, maxSongs);
    box.appendChild(makeRadio(i, `${start.toLocaleString()}〜${end.toLocaleString()}位`));
  }
  box.appendChild(makeRadio('all', '全曲'));

  const g = $('growthRadio');
  g.replaceChildren();
  g.appendChild(makeRadio('growth', '増加割合増加曲'));
}

function renderPager(pages, total) {
  const box = $('pager');
  box.replaceChildren();
  const mk = (label, p, disabled) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.disabled = disabled;
    b.onclick = () => { page = p; renderTable(); };
    return b;
  };
  box.appendChild(mk('最初', 0, page === 0));
  box.appendChild(mk('前へ', page - 1, page === 0));
  box.appendChild(mk('次へ', page + 1, page >= pages - 1));
  box.appendChild(mk('最後', pages - 1, page >= pages - 1));
  const s = document.createElement('span');
  s.textContent = ` ${page + 1} / ${pages} ページ（${total.toLocaleString()}曲中 ${PAGE_SIZE}曲ずつ表示）`;
  box.appendChild(s);
}

/* ---------- 表 ---------- */
let tableToken = 0;

async function renderTable() {
  const token = ++tableToken;
  const body = $('body');
  if (!data) {
    body.replaceChildren();
    $('pager').replaceChildren();
    return;
  }

  const growthMode = range === 'growth';
  let list = [];
  let info = null;
  $('rangeNote').textContent = '';

  if (growthMode) {
    $('rangeNote').textContent = '計算中…';
    info = await growthInfo(dataDate);
    if (token !== tableToken) return; // 途中で操作された場合は中断
    if (!info) {
      $('rangeNote').textContent = '増加割合を比べるには、この取得日を含めて3日分以上のデータが必要です。';
    } else {
      list = fullList(data, current).filter(v => info.has(v.contentId));
      $('rangeNote').textContent = `（前日比の再生数増加率が、その前日の増加率より増えた曲：${list.length.toLocaleString()}曲）`;
    }
  } else {
    list = applyRange(fullList(data, current), range);
  }

  for (const th of document.querySelectorAll('.gcol')) th.hidden = !growthMode;

  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (page >= pages) page = pages - 1;

  body.replaceChildren();
  for (const v of list.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE)) {
    const tr = document.createElement('tr');
    tr.appendChild(td(v.rank, 'num'));
    tr.appendChild(td(v.contentId));
    const t = document.createElement('td');
    const a = document.createElement('a');
    a.href = 'https://nico.ms/' + encodeURIComponent(v.contentId);
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = v.title;
    t.appendChild(a);
    tr.appendChild(t);
    tr.appendChild(td(fmtDate(v.startTime)));
    tr.appendChild(td(fmtNum(v.viewCounter), 'num'));
    tr.appendChild(td(fmtNum(v.likeCounter), 'num'));
    tr.appendChild(td(fmtNum(v.commentCounter), 'num'));
    tr.appendChild(td(fmtNum(v.mylistCounter), 'num'));
    tr.appendChild(td(fmtDate(v.lastCommentTime)));
    if (growthMode) {
      const g = info.get(v.contentId);
      tr.appendChild(td(fmtPct(g.r2), 'num'));
      tr.appendChild(td(fmtPct(g.r1), 'num'));
    }
    body.appendChild(tr);
  }
  renderPager(pages, list.length);
}

async function load(date) {
  data = await getData(date);
  dataDate = date;
  page = 0;
  let t = '（スナップショット: ' + fmtDate(data.snapshot) + ' 時点';
  if (data.totalCount) t += '／該当 ' + data.totalCount.toLocaleString() + ' 曲';
  if (!data.legacy) t += '／取得済み ' + data.rows.length.toLocaleString() + ' 曲';
  t += '）';
  if (data.legacy) t += ' ※この日は旧形式（上位のみ）のデータです';
  $('meta').textContent = t;
  renderTable();
}

/* ---------- グラフ ---------- */
let graphToken = 0;

async function renderGraph() {
  const token = ++graphToken;
  const msg = $('graphMsg');
  const asc = [...dates].sort(); // 古い順（横軸の左から右）
  if (!asc.length) { msg.textContent = 'データがありません'; return; }

  // 全日分のデータを4日ずつ読み込む
  let n = 0;
  for (let i = 0; i < asc.length; i += 4) {
    msg.textContent = `読み込み中… ${n}/${asc.length}日`;
    const batch = asc.slice(i, i + 4);
    await Promise.all(batch.map(getData));
    n += batch.length;
    if (token !== graphToken) return; // 途中で操作された場合は中断
  }
  await drawChart(asc, token);
}

async function drawChart(asc, token) {
  const metric = $('metric').value;
  const metricLabel = METRICS.find(m => m[0] === metric)[1];
  const useLog = $('logScale').checked && metric !== 'rank';
  const all = await Promise.all(asc.map(getData));
  if (token !== graphToken) return;

  // 増加割合増加曲: 最新の取得日で条件を満たした曲だけを対象にする
  let allowed = null;
  if (range === 'growth') {
    allowed = await growthInfo(asc[asc.length - 1]);
    if (token !== graphToken) return;
    if (!allowed) {
      $('graphMsg').textContent = '増加割合を比べるには、3日分以上のデータが必要です。';
      if (chart) { chart.destroy(); chart = null; }
      return;
    }
  }

  // 曲（作品ID）ごとに、日付順の値の配列を作る
  const series = new Map();
  all.forEach((d, di) => {
    const list = allowed
      ? fullList(d, current).filter(r => allowed.has(r.contentId))
      : applyRange(fullList(d, current), range);
    for (const r of list) {
      let s = series.get(r.contentId);
      if (!s) {
        s = { title: r.title, values: new Array(asc.length).fill(null) };
        series.set(r.contentId, s);
      }
      s.title = r.title;
      s.values[di] = r[metric] ?? null;
    }
  });
  $('graphMsg').textContent = `${asc.length}日分のデータ／${series.size.toLocaleString()}曲`;

  const datasets = [];
  let i = 0;
  for (const [id, s] of series) {
    const color = `hsl(${(i * 137.508) % 360}, 70%, 45%)`;
    datasets.push({
      label: s.title,
      contentId: id,
      data: s.values,
      borderColor: color,
      backgroundColor: color,
      borderWidth: 1,
      pointRadius: 2,
      pointHoverRadius: 5,
      spanGaps: true,
      tension: 0,
    });
    i++;
  }

  // 順位の縦軸は、選んだ範囲（1111位ずつ）に合わせる
  let rankAxis = {};
  if (metric === 'rank' && typeof range === 'number') {
    const max = maxSongs > 0 ? Math.min((range + 1) * BLOCK, maxSongs) : (range + 1) * BLOCK;
    rankAxis = { min: range * BLOCK + 1, max };
  }

  if (chart) chart.destroy();
  chart = new Chart($('chart'), {
    type: 'line',
    data: { labels: asc, datasets },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: true },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => `${c.dataset.contentId} ${c.dataset.label}: ${c.formattedValue}`,
          },
        },
      },
      scales: {
        x: { title: { display: true, text: '取得日' } },
        y: {
          type: useLog ? 'logarithmic' : 'linear',
          reverse: metric === 'rank',
          ...rankAxis,
          title: { display: true, text: metricLabel },
        },
      },
      onClick: (e, els) => {
        if (!els.length) return;
        const id = datasets[els[0].datasetIndex].contentId;
        window.open('https://nico.ms/' + encodeURIComponent(id), '_blank', 'noopener');
      },
    },
  });
}

/* ---------- 初期化 ---------- */
async function init() {
  for (const [key, label] of METRICS) {
    const o = document.createElement('option');
    o.value = key; o.textContent = label;
    $('metric').appendChild(o);
  }
  $('metric').value = DEFAULT_METRIC[current];
  $('metric').onchange = () => { if (view === 'graph') renderGraph(); };
  $('logScale').onchange = () => { if (view === 'graph') renderGraph(); };

  renderRangeRadios();
  renderViews();
  renderTabs();

  dates = await (await fetch(WORKER + '/list')).json();
  if (!dates.length) {
    $('meta').textContent = 'まだデータがありません';
    return;
  }
  const sel = $('date');
  for (const d of dates) {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  }
  sel.onchange = () => load(sel.value);
  await load(dates[0]);
}
init();
</script>
</body>
</html>
